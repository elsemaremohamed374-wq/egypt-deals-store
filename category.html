
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>أقسام EGYPT DEALS</title>

  <meta name="description" content="تصفح أقسام EGYPT DEALS واكتشف أفضل العروض والمنتجات في مصر.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0b1420">

  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="manifest" href="./manifest.json">

  <style>
    :root {
      --bg: #0b1420;
      --panel: #111e2e;
      --gold: #e9b943;
      --white: #ffffff;
      --muted: #aab5c2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #101c2b;
      border-bottom: 1px solid rgba(233,185,67,.25);
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      color: var(--gold);
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .home-link {
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--gold);
      padding: 10px 17px;
      border-radius: 8px;
      font-size: 14px;
    }

    .home-link:hover {
      background: var(--gold);
      color: #111;
    }

    .category-header {
      text-align: center;
      padding: 55px 15px 35px;
    }

    .category-header .small-title {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .category-header h1 {
      font-size: clamp(28px, 6vw, 43px);
      margin-bottom: 14px;
    }

    .category-header p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .gold-line {
      width: 75px;
      height: 3px;
      background: var(--gold);
      margin: 22px auto 0;
      border-radius: 5px;
    }

    .products-section {
      max-width: 1150px;
      margin: auto;
      padding: 15px 5% 70px;
    }

    .section-title {
      color: var(--gold);
      font-size: 20px;
      margin-bottom: 22px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .product-card {
      background: var(--panel);
      border: 1px solid #344254;
      border-radius: 15px;
      overflow: hidden;
      transition: .25s;
      min-width: 0;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold);
    }

    .product-gallery {
      padding: 12px;
      background: #fff;
    }

    .main-product-image {
      width: 100%;
      height: 220px;
      object-fit: contain;
      display: block;
      border-radius: 9px;
      background: #fff;
    }

    .product-thumbnails {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .product-thumbnail {
      width: 48px;
      height: 48px;
      padding: 3px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      overflow: hidden;
    }

    .product-thumbnail.active {
      border-color: #d5a52e;
    }

    .product-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-info {
      padding: 15px;
    }

    .product-title {
      font-size: 15px;
      line-height: 1.8;
      min-height: 80px;
      margin-bottom: 10px;
    }

    .product-rating {
      color: #ffc83d;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .product-price {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .current-price {
      color: var(--gold);
      font-size: 23px;
      font-weight: 900;
    }

    .old-price {
      color: #9ca6b5;
      text-decoration: line-through;
      font-size: 14px;
    }

    .discount-badge {
      background: #8d2525;
      color: #fff;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .buy-btn {
      display: block;
      text-align: center;
      background: var(--gold);
      color: #101827;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
      text-decoration: none;
      transition: .2s;
    }

    .buy-btn:hover {
      background: #ffcf5c;
    }

    .product-note {
      color: #aeb9c8;
      font-size: 11px;
      line-height: 1.8;
      margin-top: 12px;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: var(--panel);
      border: 1px solid rgba(233,185,67,.2);
      border-radius: 15px;
      padding: 45px 20px;
      text-align: center;
    }

    .empty-state .icon {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .empty-state h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .empty-state p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .search-result {
      color: var(--gold);
      margin-top: 15px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 22px 10px;
      border-top: 1px solid rgba(233,185,67,.15);
      color: var(--muted);
      font-size: 13px;
    }

    footer span {
      color: var(--gold);
    }

    @media(max-width:850px) {
      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media(max-width:480px) {
      .products {
        gap: 10px;
      }

      .main-product-image {
        height: 160px;
      }

      .product-info {
        padding: 11px;
      }

      .product-title {
        font-size: 13px;
        min-height: 95px;
      }

      .current-price {
        font-size: 19px;
      }

      .product-thumbnail {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body data-page="category">

  <header>
    <div class="logo">EGYPT DEALS</div>
    <a class="home-link" href="./index.html">
      العودة للرئيسية ←
    </a>
  </header>

  <section class="category-header">

    <div class="small-title">
      EGYPT DEALS COLLECTION
    </div>

    <h1 id="categoryTitle">
      تصفح القسم
    </h1>

    <p id="categoryDescription">
      اكتشف المنتجات والعروض المميزة.
    </p>

    <div class="gold-line"></div>

    <div class="search-result" id="searchResult"></div>

  </section>

  <main class="products-section">

    <h2 class="section-title">
      المنتجات والعروض
    </h2>

    <section
      class="products"
      id="productList"
      aria-live="polite">
    </section>

  </main>

  <footer>
    جميع الحقوق محفوظة ©
    <span>EGYPT DEALS</span>
  </footer>

  <script src="./products.js"></script>

  <script>
    const categories = {

      electronics: {
        title: "الإلكترونيات والتكنولوجيا",
        description: "اكتشف أحدث الأجهزة والإلكترونيات والعروض التقنية.",
        pageTitle: "الإلكترونيات | EGYPT DEALS"
      },

      fashion: {
        title: "الأزياء والملابس",
        description: "تصفح أحدث الملابس والأزياء والاختيارات المميزة.",
        pageTitle: "الأزياء والملابس | EGYPT DEALS"
      },

      home: {
        title: "الأجهزة المنزلية والديكور",
        description: "كل ما تحتاجه لمنزلك من أجهزة ومستلزمات وديكورات.",
        pageTitle: "المنزل والديكور | EGYPT DEALS"
      },

      accessories: {
        title: "الإكسسوارات",
        description: "اكتشف الإكسسوارات والساعات والشنط والنظارات.",
        pageTitle: "الإكسسوارات | EGYPT DEALS"
      },

      beauty: {
        title: "المكياج والتجميل",
        description: "اكتشف منتجات التجميل والعناية الشخصية.",
        pageTitle: "المكياج والتجميل | EGYPT DEALS"
      },

      all: {
        title: "جميع المنتجات",
        description: "تصفح جميع المنتجات والعروض المتاحة على EGYPT DEALS.",
        pageTitle: "جميع المنتجات | EGYPT DEALS"
      }

    };

    const params = new URLSearchParams(window.location.search);

    const categoryId = params.get("category") || "all";

    const searchQuery = params.get("q") || "";

    const category = categories[categoryId] || categories.all;

    document.getElementById("categoryTitle").textContent =
      category.title;

    document.getElementById("categoryDescription").textContent =
      category.description;

    document.title = category.pageTitle;

    if (searchQuery) {
      document.getElementById("searchResult").textContent =
        "نتيجة البحث عن: " + searchQuery;
    }
  </script>

</body>
</html>
